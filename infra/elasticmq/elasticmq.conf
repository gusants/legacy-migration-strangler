include classpath("application.conf")

node-address {
  protocol = http
  host = localhost
  port = 9324
  context-path = ""
}

rest-sqs {
  enabled = true
  bind-port = 9324
  bind-hostname = "0.0.0.0"
  sqs-limits = strict
}

queues {
  charges-incoming-dlq {}
  charges-legacy-dlq {}
  charges-new-dlq {}

  charges-incoming {
    defaultVisibilityTimeout = 30 seconds
    deadLettersQueue {
      name = "charges-incoming-dlq"
      maxReceiveCount = 5
    }
  }

  charges-legacy {
    defaultVisibilityTimeout = 30 seconds
    deadLettersQueue {
      name = "charges-legacy-dlq"
      maxReceiveCount = 5
    }
  }

  charges-new {
    defaultVisibilityTimeout = 30 seconds
    deadLettersQueue {
      name = "charges-new-dlq"
      maxReceiveCount = 5
    }
  }
}
