<VirtualHost *:80>
    DocumentRoot /var/www/html
    SetEnv CI_ENV ${CI_ENV}
    <Directory /var/www/html>
        AllowOverride All
        Require all granted
    </Directory>
    <DirectoryMatch "^/var/www/html/(application|system)">
        Require all denied
    </DirectoryMatch>
</VirtualHost>
