name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contract:
    name: contract (${{ matrix.target }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: legacy
            url: http://localhost:8080
            services: legacy-db legacy
          - target: new
            url: http://localhost:3000
            services: new-db new
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Start ${{ matrix.target }} service
        run: |
          cp .env.example .env
          docker compose up -d --build --wait ${{ matrix.services }}

      - name: Wait for /health
        run: |
          for attempt in $(seq 1 30); do
            curl -fsS "${{ matrix.url }}/health" && exit 0
            sleep 2
          done
          echo "${{ matrix.target }} did not become healthy" >&2
          exit 1

      - name: PHP lint
        if: matrix.target == 'legacy'
        run: pnpm legacy:lint

      - name: Reference examples smoke test
        run: ./scripts/smoke-examples.sh
        env:
          TARGET_URL: ${{ matrix.url }}

      - name: Contract suite
        working-directory: contract-tests
        run: pnpm vitest run --reporter=default --reporter=json --outputFile.json=../reports/contract-${{ matrix.target }}.json
        env:
          TARGET_URL: ${{ matrix.url }}

      - name: Results per rule
        if: always() && hashFiles(format('reports/contract-{0}.json', matrix.target)) != ''
        run: ./scripts/contract-summary.sh reports/contract-${{ matrix.target }}.json ${{ matrix.target }} >> "$GITHUB_STEP_SUMMARY"

      - name: Service logs
        if: failure()
        run: docker compose logs --no-color

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: contract-report-${{ matrix.target }}
          path: reports/
          if-no-files-found: ignore

  new-service-quality:
    name: new-service quality
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: new-service
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm lint

      - run: pnpm typecheck

      - run: pnpm test:cov

      - run: pnpm test:integration

      - run: pnpm build

  router-quality:
    name: router quality
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: router
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm lint

      - run: pnpm typecheck

      - run: pnpm test:cov

      - run: pnpm test:integration

      - run: pnpm build

  comparator-quality:
    name: comparator quality
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: comparator
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm lint

      - run: pnpm typecheck

      - run: pnpm test:cov

      - run: pnpm test:integration

      - run: pnpm build

  routing-flow:
    name: routing flow (queue, router, legacy)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Start queue, legacy and router
        run: |
          cp .env.example .env
          docker compose up -d --build --wait elasticmq legacy-db legacy legacy-worker router

      - name: Wait for the queues to exist
        run: |
          for attempt in $(seq 1 30); do
            if curl -fsS "http://localhost:9324/?Action=ListQueues" | grep -q "charges-legacy-dlq"; then
              exit 0
            fi
            sleep 2
          done
          echo "elasticmq did not expose the queues" >&2
          exit 1

      # 3 invalid messages need 5 receives x 30 s visibility to reach charges-incoming-dlq (about 3 min)
      - name: Produce messages and verify no loss, no duplication and dead-lettering
        run: pnpm verify:flow --count 300 --invalid 3 --timeout 300

      - name: Service logs
        if: failure()
        run: docker compose logs --no-color

      - name: Stop services
        if: always()
        run: docker compose down -v

  shadow-run:
    name: shadow run (legacy x new comparison)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Start queue, legacy, new service and router
        run: |
          cp .env.example .env
          docker compose up -d --build --wait elasticmq legacy-db legacy legacy-worker new-db new router

      - name: Wait for the queues to exist
        run: |
          for attempt in $(seq 1 30); do
            if curl -fsS "http://localhost:9324/?Action=ListQueues" | grep -q "charges-new-dlq"; then
              exit 0
            fi
            sleep 2
          done
          echo "elasticmq did not expose the queues" >&2
          exit 1

      - name: Route every message to the legacy and a shadow copy to the new service
        run: pnpm routing:set shadow

      - name: Record the new service dead-letter depth
        run: echo "NEW_DLQ_BEFORE=$(./scripts/queue-depth.sh charges-new-dlq)" >> "$GITHUB_ENV"

      - name: Produce 500 messages and verify the legacy flow
        run: pnpm verify:flow --count 500 | tee verify-flow.log

      - name: Wait for the shadow queue to drain
        run: ./scripts/wait-queue-drained.sh charges-new 180

      - name: Compare legacy and shadow results
        run: |
          run_id="$(awk '/^run /{ print $2; exit }' verify-flow.log)"
          test -n "${run_id}"
          pnpm compare --run-id "${run_id}" --settle-seconds 0

      - name: Shadow copies stayed out of the official table and the dead-letter queue
        run: |
          run_id="$(awk '/^run /{ print $2; exit }' verify-flow.log)"
          ./scripts/assert-shadow-isolation.sh "${run_id}" "${NEW_DLQ_BEFORE}"

      - name: Comparison summary
        if: always() && hashFiles('reports/shadow-*.md') != ''
        run: cat reports/shadow-*.md >> "$GITHUB_STEP_SUMMARY"

      - name: Service logs
        if: failure()
        run: docker compose logs --no-color

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: shadow-report
          path: reports/shadow-*
          if-no-files-found: ignore

      - name: Stop services
        if: always()
        run: docker compose down -v

  rollout:
    name: rollout (shadow, 10, 50, 100, new)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Every job runs on its own runner VM, so this job and shadow-run never share
    # CPU, memory, ports or compose projects; only the ref-wide concurrency group applies.
    defaults:
      run:
        shell: bash
    env:
      ROLLOUT_COUNT: "150"
      ROLLOUT_GATE_RETRIES: "5"
      ROLLOUT_GATE_INTERVAL_SECONDS: "10"
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Start queue, legacy, new service and router
        run: |
          cp .env.example .env
          docker compose up -d --build --wait elasticmq legacy-db legacy legacy-worker new-db new router

      - name: Wait for the queues to exist
        run: |
          for queue in charges-incoming charges-legacy charges-new charges-new-dlq; do
            for attempt in $(seq 1 30); do
              curl -fsS "http://localhost:9324/?Action=ListQueues" | grep -q "${queue}" && continue 2
              sleep 2
            done
            echo "elasticmq did not expose ${queue}" >&2
            exit 1
          done

      - name: Stage shadow
        run: pnpm rollout shadow

      - name: Stage 10%
        run: pnpm rollout 10

      - name: Stage 50%
        run: pnpm rollout 50

      - name: Stage 100%
        run: pnpm rollout 100

      - name: Stage new
        run: pnpm rollout new

      - name: A failing stage rolls back to the previous config
        run: |
          before="$(jq -c . router/config/routing.json)"
          docker compose stop new
          if ROLLOUT_DRAIN_TIMEOUT_SECONDS=20 ROLLOUT_FLOW_TIMEOUT_SECONDS=20 pnpm rollout 100; then
            echo "rollout 100 passed with the new service stopped" >&2
            exit 1
          fi
          after="$(jq -c . router/config/routing.json)"
          echo "before=${before} after=${after}"
          test "${before}" = "${after}"

      - name: Rollout summary
        if: always() && hashFiles('reports/rollout-*.md') != ''
        run: |
          for report in reports/rollout-*.md; do
            cat "${report}"
            echo
          done >> "$GITHUB_STEP_SUMMARY"

      - name: Service logs
        if: failure()
        run: docker compose logs --no-color

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rollout-report
          path: |
            reports/rollout-*
            reports/audit-*
            reports/shadow-*
          if-no-files-found: ignore

      - name: Stop services
        if: always()
        run: docker compose down -v
