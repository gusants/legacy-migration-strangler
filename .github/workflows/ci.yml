name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contract:
    name: contract (${{ matrix.target }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: legacy
            url: http://localhost:8080
            services: legacy-db legacy
          - target: new
            url: http://localhost:3000
            services: new-db new
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Start ${{ matrix.target }} service
        run: |
          cp .env.example .env
          docker compose up -d --build --wait ${{ matrix.services }}

      - name: Wait for /health
        run: |
          for attempt in $(seq 1 30); do
            curl -fsS "${{ matrix.url }}/health" && exit 0
            sleep 2
          done
          echo "${{ matrix.target }} did not become healthy" >&2
          exit 1

      - name: PHP lint
        if: matrix.target == 'legacy'
        run: pnpm legacy:lint

      - name: Reference examples smoke test
        run: ./scripts/smoke-examples.sh
        env:
          TARGET_URL: ${{ matrix.url }}

      - name: Contract suite
        working-directory: contract-tests
        run: pnpm vitest run --reporter=default --reporter=json --outputFile.json=../reports/contract-${{ matrix.target }}.json
        env:
          TARGET_URL: ${{ matrix.url }}

      - name: Results per rule
        if: always() && hashFiles(format('reports/contract-{0}.json', matrix.target)) != ''
        run: ./scripts/contract-summary.sh reports/contract-${{ matrix.target }}.json ${{ matrix.target }} >> "$GITHUB_STEP_SUMMARY"

      - name: Service logs
        if: failure()
        run: docker compose logs --no-color

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: contract-report-${{ matrix.target }}
          path: reports/
          if-no-files-found: ignore

  new-service-quality:
    name: new-service quality
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: new-service
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm lint

      - run: pnpm typecheck

      - run: pnpm test:cov

      - run: pnpm test:integration

      - run: pnpm build

  router-quality:
    name: router quality
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: router
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm lint

      - run: pnpm typecheck

      - run: pnpm test:cov

      - run: pnpm test:integration

      - run: pnpm build

  comparator-quality:
    name: comparator quality
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: comparator
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm lint

      - run: pnpm typecheck

      - run: pnpm test:cov

      - run: pnpm test:integration

      - run: pnpm build

  routing-flow:
    name: routing flow (queue, router, legacy)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Start queue, legacy and router
        run: |
          cp .env.example .env
          docker compose up -d --build --wait elasticmq legacy-db legacy legacy-worker router

      - name: Wait for the queues to exist
        run: |
          for attempt in $(seq 1 30); do
            if curl -fsS "http://localhost:9324/?Action=ListQueues" | grep -q "charges-legacy-dlq"; then
              exit 0
            fi
            sleep 2
          done
          echo "elasticmq did not expose the queues" >&2
          exit 1

      # 3 invalid messages need 5 receives x 30 s visibility to reach charges-incoming-dlq (about 3 min)
      - name: Produce messages and verify no loss, no duplication and dead-lettering
        run: pnpm verify:flow --count 300 --invalid 3 --timeout 300

      - name: Service logs
        if: failure()
        run: docker compose logs --no-color

      - name: Stop services
        if: always()
        run: docker compose down -v

  shadow-run:
    name: shadow run (legacy x new comparison)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Start queue, legacy, new service and router
        run: |
          cp .env.example .env
          docker compose up -d --build --wait elasticmq legacy-db legacy legacy-worker new-db new router

      - name: Wait for the queues to exist
        run: |
          for attempt in $(seq 1 30); do
            if curl -fsS "http://localhost:9324/?Action=ListQueues" | grep -q "charges-new-dlq"; then
              exit 0
            fi
            sleep 2
          done
          echo "elasticmq did not expose the queues" >&2
          exit 1

      - name: Route every message to the legacy and a shadow copy to the new service
        run: pnpm routing:set shadow

      - name: Produce 500 messages and verify the legacy flow
        run: pnpm verify:flow --count 500 | tee verify-flow.log

      - name: Wait for the shadow queue to drain
        run: ./scripts/wait-queue-drained.sh charges-new 180

      - name: Compare legacy and shadow results
        run: |
          run_id="$(awk '/^run /{ print $2; exit }' verify-flow.log)"
          test -n "${run_id}"
          pnpm compare --run-id "${run_id}" --settle-seconds 0

      - name: Comparison summary
        if: always() && hashFiles('reports/shadow-*.md') != ''
        run: cat reports/shadow-*.md >> "$GITHUB_STEP_SUMMARY"

      - name: Service logs
        if: failure()
        run: docker compose logs --no-color

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: shadow-report
          path: reports/shadow-*
          if-no-files-found: ignore

      - name: Stop services
        if: always()
        run: docker compose down -v
